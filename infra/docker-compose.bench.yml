# Throwaway benchmark stack for the #15 tier-2 runs (docs/testing/stress-and-chaos.md).
# Runs beside the live stack as its own compose project, with its own empty Postgres/Redis volumes,
# so load and stuffing test rows never reach the live database:
#   docker compose -p salesmesh-bench --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.bench.yml \
#     up -d --build postgres redis ml-engine gateway
#   ... run the scripts against 127.0.0.1:14000 / :18000 / :15432 ...
#   docker compose -p salesmesh-bench --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.bench.yml down -v
# Ports bind to 127.0.0.1 only. The PWA and Caddy are not started. Fabric and payouts are off.

services:
  postgres:
    container_name: salesmesh-bench-postgres   # the base file pins salesmesh-postgres for the live stack
    ports: ["127.0.0.1:15432:5432"]

  ml-engine:
    ports: ["127.0.0.1:18000:8000"]

  gateway:
    ports: ["127.0.0.1:14000:4000"]
    environment:
      FABRIC_ENABLED: "false"
      PAYOUTS_ENABLED: "false"
