name: Gateway CI

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-gateway.yml'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check Environment
        run: |
          node -v
          echo "Gateway CI runner initialized successfully."