name: Gateway CI

on:
  push:
    paths:
      - 'backend/**'
      - 'infra/scripts/**'
      - 'blockchain/**'
      - 'Makefile'
      - '.github/workflows/ci-gateway.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/scripts/**'
      - 'blockchain/**'
      - 'Makefile'
      - '.github/workflows/ci-gateway.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gateway
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:pg@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/gateway/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test

  # DLT-03 (#10): the gateway's ledger sync against the real Fabric testnet and a throwaway Postgres.
  ledger-e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # require(esm) under jest (--experimental-vm-modules) for fabric-gateway's @noble/curves
          cache: npm
          cache-dependency-path: backend/gateway/package-lock.json
      - name: Install dependencies
        working-directory: backend/gateway
        run: npm ci
      - name: Ledger sync e2e (commit, quarantine, release, authorise, settle, peer outage)
        run: make fabric-ledger-e2e
