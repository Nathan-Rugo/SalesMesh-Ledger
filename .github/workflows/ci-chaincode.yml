name: Fabric Testnet CI

on:
  push:
    paths:
      - 'blockchain/network/**'
      - 'blockchain/chaincode/**'
      - '.github/workflows/ci-chaincode.yml'
  pull_request:
    paths:
      - 'blockchain/network/**'
      - 'blockchain/chaincode/**'
      - '.github/workflows/ci-chaincode.yml'

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Latest 1.27 patch, the chaincode images' builder (golang:1.27-alpine): govulncheck also checks the stdlib.
          go-version: '1.27.x'
          check-latest: true
          cache-dependency-path: blockchain/chaincode/go.sum
      - name: Commission chaincode unit tests (vet, race, coverage)
        run: make fabric-chaincode-test
      - name: Known vulnerabilities in reachable code (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          (cd blockchain/chaincode && govulncheck ./...)
          (cd blockchain/network/smoke-chaincode && govulncheck ./...)

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fabric testnet smoke test (up, CCaaS deploy, 2-org invoke, query, down)
        run: make fabric-smoke

  commission-e2e:
    needs: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Commission chaincode e2e (deploy, every function by role, upgrade, down)
        run: make fabric-commission-e2e
