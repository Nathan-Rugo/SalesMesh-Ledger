name: ML Engine CI

on:
  push:
    paths:
      - 'ml-engine/**'
      - '.github/workflows/ci-ml-engine.yml'
  pull_request:
    paths:
      - 'ml-engine/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Environment
        run: |
          python --version
          echo "ML Engine CI runner initialized successfully."