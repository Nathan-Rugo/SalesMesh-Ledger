name: ML Engine CI

on:
  push:
    paths:
      - 'ml-engine/**'
      - '.github/workflows/ci-ml-engine.yml'
  pull_request:
    paths:
      - 'ml-engine/**'
      - '.github/workflows/ci-ml-engine.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engine
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml-engine/requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run test suite
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t salesmesh-ml-engine:ci ml-engine
      - name: Run container and wait for its own HEALTHCHECK
        run: |
          digest=$(cut -d' ' -f1 ml-engine/models/risk_cascade_v1.0.0.joblib.sha256)
          docker run -d --name ml -e MODEL_SHA256="$digest" salesmesh-ml-engine:ci
          for i in $(seq 1 40); do
            health=$(docker inspect --format '{{.State.Health.Status}}' ml)
            echo "health: $health"
            if [ "$health" = "healthy" ]; then break; fi
            if [ "$health" = "unhealthy" ] || [ "$i" = "40" ]; then
              docker logs ml
              exit 1
            fi
            sleep 3
          done
      - name: Assert the service runs as non-root
        run: |
          uid=$(docker exec ml id -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Container logs
        if: always()
        run: docker logs ml || true
