name: Infra CI

on:
  push:
    paths:
      - 'infra/**'
      - '.env.example'
      - '.github/workflows/ci-infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - '.env.example'
      - '.github/workflows/ci-infra.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose files are valid (app + Fabric overlay)
        # The gateway's env_file is the root .env: use the placeholders from .env.example.
        run: |
          cp .env.example .env
          docker compose --env-file .env.example -f infra/docker-compose.yml -f infra/docker-compose.fabric.yml config -q
          docker compose --env-file .env.example -f infra/docker-compose.yml config -q
      - name: Caddyfile is valid
        run: docker run --rm -e PUBLIC_HOST=203.0.113.10.sslip.io -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Deploy scripts (bash -n, shellcheck)
        run: |
          for f in infra/scripts/deploy/*.sh; do bash -n "$f"; done
          shellcheck infra/scripts/deploy/*.sh
      - name: gen_env.sh test
        run: bash infra/scripts/deploy/gen_env_test.sh
